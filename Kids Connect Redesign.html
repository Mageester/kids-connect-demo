<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Connect — Navigating a Social World Through Play</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="pages-home.jsx"></script>
  <script type="text/babel" src="pages-programs-about.jsx"></script>
  <script type="text/babel" src="pages-faq-contact.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "primaryColor": "#1B6B6B",
      "accentColor": "#C97B5D",
      "cardRadius": 16
    }/*EDITMODE-END*/;

    function Root() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        const r = document.documentElement;
        r.style.setProperty('--color-primary', t.primaryColor);
        r.style.setProperty('--color-accent', t.accentColor);
        r.style.setProperty('--radius', t.cardRadius + 'px');
      }, [t]);

      return (
        <React.Fragment>
          <App />
          <TweaksPanel title="Design Tweaks">
            <TweakSection label="Brand Colors">
              <TweakColor
                label="Primary Color"
                value={t.primaryColor}
                onChange={v => setTweak('primaryColor', v)}
                options={['#1B6B6B', '#1E4D6E', '#2D5A3D', '#4A4A6A']}
              />
              <TweakColor
                label="Accent Color"
                value={t.accentColor}
                onChange={v => setTweak('accentColor', v)}
                options={['#C97B5D', '#D4956A', '#C4727F', '#B8923E']}
              />
            </TweakSection>
            <TweakSection label="Style">
              <TweakSlider
                label="Card Radius"
                min={0} max={24} step={4}
                value={t.cardRadius}
                onChange={v => setTweak('cardRadius', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
